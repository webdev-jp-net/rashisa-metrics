# 敬語形態素辞書（Phase 1-B 敬語形態素率 / Phase 3 丁寧度相互配置用）
# 適用対象: SudachiPy 分割モードA の形態素列（lemma = 辞書形で照合）
# 密度の定義: カテゴリ別マッチ形態素数 / 総形態素数（記号・空白除く）

meta:
  version: '1.0'
  tokenizer: sudachipy_mode_A
  matchKey: lemma # 表層形でなく辞書形で照合。構文パターンのみ表層正規表現

sonkeigo: # 尊敬語（相手・第三者の行為を高める）
  lemmaList:
    - いらっしゃる
    - おっしゃる
    - なさる
    - 下さる # くださる。補助動詞用法（〜してくださる）を含む
    - 召し上がる
    - ご覧になる
  surfacePatternList:
    - '(お|ご)[一-龥ぁ-んー]{1,6}(になる|になり|になっ)' # お読みになる型
    - '(お|ご)[一-龥ぁ-んー]{1,6}(ください|下さい)' # ご確認ください型（相手の行為への要請）
  exclusionList:
    - rule: 助動詞「れる・られる」の尊敬用法は受身・可能と同形であり形態素情報から分離不能。本辞書では計測対象外とし、検証レポートの測定不能一覧に「られる系尊敬」を理由つきで掲載する

kenjougo: # 謙譲語（自分側の行為を低める）
  lemmaList:
    - 致す # いたす
    - 頂く # いただく。補助動詞用法（〜していただく）を含む
    - 申す
    - 申し上げる
    - 伺う
    - 参る
    - 拝見
    - 拝借
    - 存じる
    - 承る
    - 頂戴
    - 差し上げる
    - お目にかかる
    - 恐れ入る # おそれいります
  surfacePatternList:
    - '(お|ご)[一-龥ぁ-んー]{1,6}(する|します|しました|いたします|いたしました)' # お伝えする・ご連絡します型
    - 'させて(いただ|頂)' # させていただく構文
  notes: 頂く は授受動詞用法（物をもらう）と謙譲補助動詞用法が同一 lemma。分離せず一括で謙譲に計上し、その旨を出力の指標定義に明記する

teineigo: # 丁寧語（聞き手への丁寧さ）
  lemmaList:
    - です
    - ます
    - ございます
  surfacePatternList:
    - 'でございます'

politenessIndex:
  description: Phase 3 の丁寧度相互配置に使う合成指標の定義
  formula: '(sonkeigo密度 + kenjougo密度 + teineigo密度) を形態素1000個あたりに正規化した値。3分類の内訳も常に併記する'
  notes: 二者の差分（非対称性）は同一辞書適用のため辞書の網羅性不足に対して頑健。絶対値は辞書網羅性に依存するため、シート上は差分を主、絶対値を参考として表示する
